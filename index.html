<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>てしかが冒険マップ | 弟子屈高校 地域みらい留学ガイド</title>
  <!-- Google Fonts: ドット絵風と読みやすいゴシック体の組み合わせ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --rpg-bg: rgba(16, 24, 39, 0.92);
      --rpg-border: #f8fafc;
      --rpg-accent: #fbbf24;
      --rpg-blue: #38bdf8;
      --rpg-green: #4ade80;
      --rpg-red: #f87171;
      --rpg-purple: #c084fc;
      --stamp-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #1e3a2f;
      color: #ffffff;
    }

    /* 3Dキャンバス */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }

    /* RPG風ウィンドウ共通スタイル */
    .rpg-box {
      background: var(--rpg-bg);
      border: 3px solid var(--rpg-border);
      border-radius: 12px;
      box-shadow: 0 0 0 3px #0f172a, 0 10px 25px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
    }

    .rpg-font {
      font-family: 'DotGothic16', sans-serif;
      letter-spacing: 0.05em;
    }

    /* ヘッダーUI */
    #header-ui {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      pointer-events: auto;
      max-width: 680px;
      gap: 10px;
    }

    .title-bar h1 {
      font-size: 1.1rem;
      color: var(--rpg-accent);
      text-shadow: 2px 2px 0 #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-bar p {
      font-size: 0.72rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .reset-cam-btn {
      background: #334155;
      color: #fff;
      border: 2px solid #94a3b8;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .reset-cam-btn:hover {
      background: #475569;
      border-color: var(--rpg-accent);
      color: var(--rpg-accent);
    }

    /* スタンプラリー進捗バー */
    .stamp-progress-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      pointer-events: auto;
      max-width: 680px;
      gap: 12px;
      background: rgba(15, 23, 42, 0.94);
    }

    .stamp-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .stamp-count {
      color: var(--rpg-accent);
      font-size: 1rem;
    }

    .progress-track {
      flex: 1;
      height: 12px;
      background: #1e293b;
      border: 2px solid #64748b;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fde047);
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ジャンルフィルター */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      pointer-events: auto;
    }

    .filter-btn {
      background: rgba(15, 23, 42, 0.88);
      color: #e2e8f0;
      border: 2px solid #64748b;
      border-radius: 20px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    .filter-btn:hover {
      transform: translateY(-2px);
      border-color: #fff;
    }

    .filter-btn.active {
      background: var(--rpg-accent);
      color: #0f172a;
      border-color: #fff;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
    }

    /* 3D空間上のフローティングラベル */
    #labels-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .spot-label {
      position: absolute;
      transform: translate(-50%, -100%);
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #fff;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.15s, border-color 0.15s, background-color 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* スタンプ取得済みのラベルスタイル */
    .spot-label.stamped {
      border-color: #fbbf24;
      background: rgba(120, 53, 15, 0.95);
    }

    .spot-label:hover, .spot-label.selected {
      transform: translate(-50%, -115%) scale(1.08);
      border-color: var(--rpg-accent);
      background: #1e293b;
      z-index: 20;
    }

    .spot-label::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #fff transparent transparent transparent;
    }

    .spot-label.stamped::after {
      border-color: #fbbf24 transparent transparent transparent;
    }

    /* 操作ガイド（左下） */
    .controls-hint {
      position: absolute;
      bottom: 14px;
      left: 14px;
      z-index: 8;
      padding: 8px 12px;
      font-size: 0.72rem;
      color: #cbd5e1;
      pointer-events: none;
    }

    /* 詳細モーダル（RPGステータスウィンドウ風） */
    #detail-modal {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: calc(100% - 32px);
      max-width: 430px;
      max-height: 82vh;
      overflow-y: auto;
      z-index: 30;
      padding: 16px;
      transform: translateY(130%);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
    }

    #detail-modal.open {
      transform: translateY(0);
      opacity: 1;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px dashed #475569;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .rpg-tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #0f172a;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }

    .close-btn {
      background: transparent;
      border: 2px solid #94a3b8;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .close-btn:hover {
      border-color: var(--rpg-red);
      color: var(--rpg-red);
    }

    /* スタンプ押印アクションエリア */
    .stamp-action-area {
      margin-bottom: 12px;
    }

    .btn-stamp {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 11px;
      border-radius: 10px;
      border: 2px solid #fef08a;
      box-shadow: 0 4px 0 #92400e;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-stamp:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #92400e;
    }

    .btn-stamp.stamped {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #a7f3d0;
      box-shadow: 0 4px 0 #065f46;
    }

    /* 所要時間ステータス枠 */
    .access-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 10px;
    }

    .access-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .access-icon {
      font-size: 1.25rem;
    }

    .access-label {
      font-size: 0.68rem;
      color: #94a3b8;
    }

    .access-value {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--rpg-accent);
    }

    .modal-desc {
      font-size: 0.85rem;
      line-height: 1.55;
      color: #f1f5f9;
      margin-bottom: 10px;
      background: rgba(15, 23, 42, 0.6);
      padding: 9px;
      border-radius: 8px;
      border-left: 3px solid var(--rpg-accent);
    }

    .info-list {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-youtube {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ef4444;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 9px;
      border-radius: 8px;
      border: 2px solid #fca5a5;
      box-shadow: 0 4px 0 #991b1b;
      transition: transform 0.1s;
    }
    .btn-youtube:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #991b1b;
    }

    .btn-gmap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.83rem;
      padding: 8px;
      border-radius: 8px;
      border: 2px solid #7dd3fc;
      box-shadow: 0 4px 0 #075985;
      transition: transform 0.1s;
    }
    .btn-gmap:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #075985;
    }

    /* スタンプ押印時のポップアップ演出 */
    #stamp-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      z-index: 100;
      background: rgba(15, 23, 42, 0.96);
      border: 4px solid #fbbf24;
      border-radius: 16px;
      padding: 20px 28px;
      text-align: center;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #stamp-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .toast-icon {
      font-size: 3rem;
      margin-bottom: 6px;
      animation: bounce 0.6s ease infinite alternate;
    }

    .toast-title {
      font-size: 1.25rem;
      color: #fbbf24;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .toast-sub {
      font-size: 0.85rem;
      color: #f8fafc;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-6px); }
    }

    @media (max-width: 600px) {
      #detail-modal {
        right: 10px;
        left: 10px;
        bottom: 10px;
        width: auto;
        max-width: none;
      }
      .controls-hint {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- 3Dマップ描画エリア -->
  <div id="canvas-container"></div>

  <!-- 3D空間上のピン・ラベル表示エリア -->
  <div id="labels-container"></div>

  <!-- スタンプ獲得時のポップアップ演出 -->
  <div id="stamp-toast">
    <div class="toast-icon" id="toast-icon">💮</div>
    <div class="toast-title rpg-font" id="toast-title">スタンプ獲得！</div>
    <div class="toast-sub" id="toast-sub">冒険の記録に刻まれた！</div>
  </div>

  <!-- 上部ナビゲーションUI -->
  <div id="header-ui">
    <div class="rpg-box title-bar">
      <div>
        <h1 class="rpg-font">⚔️ てしかが冒険マップ</h1>
        <p>弟子屈高校 地域みらい留学生向け 周辺探索ガイド</p>
      </div>
      <button class="reset-cam-btn rpg-font" id="reset-cam">視点リセット</button>
    </div>

    <!-- スタンプラリー進捗バー -->
    <div class="rpg-box stamp-progress-bar">
      <div class="stamp-info rpg-font">
        <span>💮 踏破スタンプ：</span>
        <span class="stamp-count" id="stamp-count-text">0 / 9</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="stamp-progress-fill"></div>
      </div>
    </div>

    <!-- ジャンル絞り込みボタン -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-category="all">🗺️ すべて</button>
      <button class="filter-btn" data-category="stamped">💮 踏破済み</button>
      <button class="filter-btn" data-category="base">🏰 拠点（高校）</button>
      <button class="filter-btn" data-category="food">🍜 ご飯屋さん</button>
      <button class="filter-btn" data-category="shop">🎒 スーパー</button>
      <button class="filter-btn" data-category="conv">🏪 コンビニ</button>
      <button class="filter-btn" data-category="public">🏛️ 役所・駅</button>
    </div>
  </div>

  <!-- 操作ヒント -->
  <div class="rpg-box controls-hint rpg-font">
    🖱️ ドラッグで回転 / ホイールで拡大縮小 / 建物をクリックで詳細＆スタンプ押印
  </div>

  <!-- RPGステータスウィンドウ風 詳細パネル -->
  <div id="detail-modal" class="rpg-box">
    <div class="modal-header">
      <div>
        <span id="m-tag" class="rpg-tag rpg-font">【冒険の拠点】</span>

      </div>
      <button class="close-btn" id="close-modal">✕</button>

    <!-- スタンプ押印ボタン -->
    <div class="stamp-action-area">

        💮 ここに行った！（スタンプを押す）

    </div>

    <div class="access-box" id="m-access-box">
      <div class="access-item">
        <span class="access-icon">🚶</span>
        <div>
          <div class="access-label">高校から徒歩</div>

      <div class="access-item">

    </div>

    <p class="modal-desc" id="m-desc">

    </p>

    <div class="info-list">

      <div>📍 <strong>住所：</strong><span id="m-address">北海道川上郡弟子屈町...</span></div>
    </div>

    <div class="action-buttons">
      <!-- YouTube動画がある時だけ表示されるボタン -->
      <a id="m-youtube" href="#" target="_blank" rel="noopener noreferrer" class="btn-youtube">

      <a id="m-gmap" href="#" target="_blank" rel="noopener noreferrer" class="btn-gmap">
        🗺️ Googleマップでルートを見る

  </div>

    /**
     * =========================================================================
     * スタンプラリー状態管理（localStorageでブラウザに保存）
     * =========================================================================
     */
    const STORAGE_KEY = 'teshikaga_rpg_stamps_v1';
    let stampedIds = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function saveStamps() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stampedIds));
    }

    function isStamped(spotId) {
      return stampedIds.includes(spotId);
    }

    function updateStampProgressUI() {
      const total = SPOTS_DATA.length;
      const count = stampedIds.length;
      document.getElementById('stamp-count-text').textContent = `${count} / ${total}`;
      const percent = total > 0 ? (count / total) * 100 : 0;
      document.getElementById('stamp-progress-fill').style.width = `${percent}%`;
    }

    // スタンプ獲得トースト演出
    let toastTimer = null;
    function showStampToast(spotName, isComplete) {
      const toast = document.getElementById('stamp-toast');
      const iconEl = document.getElementById('toast-icon');
      const titleEl = document.getElementById('toast-title');
      const subEl = document.getElementById('toast-sub');

      if (isComplete) {
        iconEl.textContent = '👑';
        titleEl.textContent = '全エリア完全踏破！！';
        subEl.textContent = '君は立派な弟子屈マスターだ！';
      } else {
        iconEl.textContent = '💮';
        titleEl.textContent = 'スタンプ獲得！';
        subEl.textContent = `「${spotName}」を踏破した！`;
      }

      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    /**
     * =========================================================================
     * 3Dワールドマップの構築（Three.js）
     * =========================================================================
     */
    const container = document.getElementById('canvas-container');
    const labelsContainer = document.getElementById('labels-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const defaultCamPos = new THREE.Vector3(0, 26, 30);
    camera.position.copy(defaultCamPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 12;
    controls.maxDistance = 55;
    controls.target.set(0, 0, 0);

    // ライティング
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
    dirLight.position.set(20, 35, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 100;
    const d = 30;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // --- 地形（RPGフィールドの島・大地）の作成 ---
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    const groundGeo = new THREE.CylinderGeometry(28, 26, 2, 32);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4ade80 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -1;
    ground.receiveShadow = true;
    worldGroup.add(ground);

    const dirtGeo = new THREE.CylinderGeometry(26, 23, 2.5, 32);
    const dirtMat = new THREE.MeshLambertMaterial({ color: 0x92400e });
    const dirt = new THREE.Mesh(dirtGeo, dirtMat);
    dirt.position.y = -3.2;
    worldGroup.add(dirt);

    // 釧路川
    const riverGeo = new THREE.BoxGeometry(52, 0.15, 3.2);
    const riverMat = new THREE.MeshLambertMaterial({ color: 0x0ea5e9 });
    const river = new THREE.Mesh(riverGeo, riverMat);
    river.position.set(0, 0.05, -2);
    river.rotation.y = 0.18;
    river.receiveShadow = true;
    worldGroup.add(river);

    // 橋
    function createBridge(x, z, rotY) {
      const bridgeGroup = new THREE.Group();
      const deckGeo = new THREE.BoxGeometry(2.4, 0.3, 4.2);
      const woodMat = new THREE.MeshLambertMaterial({ color: 0xb45309 });
      const deck = new THREE.Mesh(deckGeo, woodMat);
      deck.position.y = 0.25;
      deck.castShadow = true;
      bridgeGroup.add(deck);

      const railGeo = new THREE.BoxGeometry(0.2, 0.6, 4.2);
      const railL = new THREE.Mesh(railGeo, woodMat);
      railL.position.set(-1.1, 0.5, 0);
      const railR = new THREE.Mesh(railGeo, woodMat);
      railR.position.set(1.1, 0.5, 0);
      bridgeGroup.add(railL, railR);

      bridgeGroup.position.set(x, 0, z);
      bridgeGroup.rotation.y = rotY;
      worldGroup.add(bridgeGroup);
    }
    createBridge(-4, -1.3, 0.18);
    createBridge(8, -3.4, 0.18);

    // 道路
    function createRoad(x, z, w, d, rotY = 0) {
      const roadGeo = new THREE.BoxGeometry(w, 0.08, d);
      const roadMat = new THREE.MeshLambertMaterial({ color: 0xfef3c7 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.position.set(x, 0.04, z);
      road.rotation.y = rotY;
      road.receiveShadow = true;
      worldGroup.add(road);
    }
    createRoad(-2, 3, 18, 1.4, -0.1);
    createRoad(-3.5, 0, 1.4, 16, 0.18);
    createRoad(8, -1, 1.4, 12, 0.18);

    // 山々
    function createMountain(x, z, radius, height) {
      const mGroup = new THREE.Group();
      const coneGeo = new THREE.ConeGeometry(radius, height, 7);
      const coneMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
      const cone = new THREE.Mesh(coneGeo, coneMat);
      cone.position.y = height / 2;
      cone.castShadow = true;
      mGroup.add(cone);

      const snowGeo = new THREE.ConeGeometry(radius * 0.35, height * 0.35, 7);
      const snowMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
      const snow = new THREE.Mesh(snowGeo, snowMat);
      snow.position.y = height * 0.83;
      mGroup.add(snow);

      mGroup.position.set(x, 0, z);
      worldGroup.add(mGroup);
    }
    createMountain(-18, -16, 5.5, 8);
    createMountain(-11, -19, 4.5, 6.5);
    createMountain(16, -15, 6, 9);

    // 木々
    function createTree(x, z) {
      const tree = new THREE.Group();
      const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1, 6);
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x78350f });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 0.5;
      tree.add(trunk);

      const leavesGeo = new THREE.ConeGeometry(1.1, 2.5, 6);
      const leavesMat = new THREE.MeshLambertMaterial({ color: 0x166534 });
      const leaves = new THREE.Mesh(leavesGeo, leavesMat);
      leaves.position.y = 2.0;
      leaves.castShadow = true;
      tree.add(leaves);

      tree.position.set(x, 0, z);
      worldGroup.add(tree);
    }

    const treeCoords = [
      [-16, 8], [-18, 2], [-14, 13], [-9, 14], [9, 13], [16, 10],
      [18, -6], [11, -11], [-7, -12], [-20, -8], [15, 6], [-11, 8]
    ];
    treeCoords.forEach(([tx, tz]) => createTree(tx, tz));

    // 温泉の湯気
    const steams = [];
    function createSteam(x, z) {
      const geo = new THREE.SphereGeometry(0.35, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.65 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.5 + Math.random() * 2, z);
      mesh.userData = { baseY: 0.5, speed: 0.015 + Math.random() * 0.01, offset: Math.random() * 10 };
      worldGroup.add(mesh);
      steams.push(mesh);
    }
    for (let i = 0; i < 6; i++) {
      createSteam(13 + (Math.random() - 0.5), 2.5 + (Math.random() - 0.5));
      createSteam(-14 + (Math.random() - 0.5), -13 + (Math.random() - 0.5));
    }

    /**
     * =========================================================================
     * スポット（建物＆クリスタルマーカー）の3D生成とHTMLラベル紐付け
     * =========================================================================
     */
    const spotObjects = [];
    const spotEntries = [];

    function updateLabelAppearance(entry) {
      const stamped = isStamped(entry.data.id);
      entry.labelEl.classList.toggle('stamped', stamped);
      const badge = stamped ? '💮 ' : '';
      entry.labelEl.innerHTML = `<span>${badge}${entry.data.icon}</span><span>${entry.data.name}</span>`;
    }

    SPOTS_DATA.forEach((spot) => {
      const group = new THREE.Group();
      group.position.set(spot.x, 0, spot.z);

      // 足元の魔法陣リング
      const ringGeo = new THREE.RingGeometry(1.1, 1.4, 24);
      const ringMat = new THREE.MeshBasicMaterial({
        color: spot.color,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.85
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.06;
      group.add(ring);

      // 建物本体
      const bMat = new THREE.MeshLambertMaterial({ color: spot.color });

      if (spot.category === 'base') {
        const mainBox = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.6, 1.6), bMat);
        mainBox.position.y = 0.8;
        mainBox.castShadow = true;
        group.add(mainBox);

        const roof = new THREE.Mesh(
          new THREE.ConeGeometry(2.1, 0.9, 4),
          new THREE.MeshLambertMaterial({ color: 0xb45309 })
        );
        roof.position.y = 2.05;
        roof.rotation.y = Math.PI / 4;
        group.add(roof);
      } else {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.3, 1.7), bMat);
        box.position.y = 0.65;
        box.castShadow = true;
        group.add(box);

        const roof = new THREE.Mesh(
          new THREE.ConeGeometry(1.4, 0.7, 4),
          new THREE.MeshLambertMaterial({ color: 0xf8fafc })
        );
        roof.position.y = 1.65;
        roof.rotation.y = Math.PI / 4;
        group.add(roof);
      }

      // クリスタルマーカー
      const crystalGeo = new THREE.OctahedronGeometry(0.45, 0);
      const crystalMat = new THREE.MeshLambertMaterial({
        color: spot.color,
        emissive: spot.color,
        emissiveIntensity: 0.4
      });
      const crystal = new THREE.Mesh(crystalGeo, crystalMat);
      crystal.position.y = spot.category === 'base' ? 3.2 : 2.6;
      group.add(crystal);

      worldGroup.add(group);

      group.traverse((child) => {
        if (child.isMesh) {
          child.userData = { spotId: spot.id };
          spotObjects.push(child);
        }
      });

      // HTMLフローティングラベル作成
      const labelEl = document.createElement('div');
      labelEl.className = 'spot-label';
      labelEl.addEventListener('click', (e) => {
        e.stopPropagation();
        selectSpot(spot.id);
      });
      labelsContainer.appendChild(labelEl);

      const entry = {
        data: spot,
        group: group,
        crystal: crystal,
        ring: ring,
        labelEl: labelEl,
        visible: true
      };

      updateLabelAppearance(entry);
      spotEntries.push(entry);
    });

    // 初回の進捗ゲージ反映
    updateStampProgressUI();

    /**
     * =========================================================================
     * インタラクション（クリック判定・詳細モーダル表示・スタンプ押印・フィルター）
     * =========================================================================
     */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      downPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const moveDist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      if (moveDist > 6) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(spotObjects);

      if (intersects.length > 0) {
        const hitSpotId = intersects[0].object.userData.spotId;
        if (hitSpotId) {
          selectSpot(hitSpotId);
        }
      }
    });

    const modal = document.getElementById('detail-modal');
    const stampBtn = document.getElementById('m-stamp-btn');
    let selectedSpotId = null;

    function updateModalStampButton(spotId) {
      if (isStamped(spotId)) {
        stampBtn.classList.add('stamped');
        stampBtn.innerHTML = '✅ 踏破済み！（クリックで解除）';
      } else {
        stampBtn.classList.remove('stamped');
        stampBtn.innerHTML = '💮 ここに行った！（スタンプを押す）';
      }
    }

    function selectSpot(spotId) {
      const entry = spotEntries.find((item) => item.data.id === spotId);
      if (!entry || !entry.visible) return;

      selectedSpotId = spotId;
      const d = entry.data;

      spotEntries.forEach((item) => {
        item.labelEl.classList.toggle('selected', item.data.id === spotId);
      });

      const tagEl = document.getElementById('m-tag');
      tagEl.textContent = d.rpgRole;
      tagEl.style.backgroundColor = d.tagColor;

      document.getElementById('m-title').textContent = `${d.icon} ${d.name}`;
      document.getElementById('m-walk').textContent = d.walkTime;
      document.getElementById('m-bike').textContent = d.bikeTime;
      document.getElementById('m-desc').textContent = d.description;
      document.getElementById('m-hours').textContent = d.hours;
      document.getElementById('m-address').textContent = d.address;
      document.getElementById('m-gmap').href = d.gmapUrl;

      updateModalStampButton(spotId);

      const ytBtn = document.getElementById('m-youtube');
      if (d.youtubeUrl && d.youtubeUrl.trim() !== "") {
        ytBtn.href = d.youtubeUrl;
        ytBtn.style.display = 'flex';
      } else {
        ytBtn.style.display = 'none';
      }

      modal.classList.add('open');
    }

    // スタンプ押印ボタンのクリック処理
    stampBtn.addEventListener('click', () => {
      if (!selectedSpotId) return;
      const entry = spotEntries.find((item) => item.data.id === selectedSpotId);
      if (!entry) return;

      if (isStamped(selectedSpotId)) {
        // スタンプ解除
        stampedIds = stampedIds.filter((id) => id !== selectedSpotId);
      } else {
        // スタンプ獲得
        stampedIds.push(selectedSpotId);
        const isComplete = stampedIds.length === SPOTS_DATA.length;
        showStampToast(entry.data.name, isComplete);
      }

      saveStamps();
      updateStampProgressUI();
      updateModalStampButton(selectedSpotId);
      updateLabelAppearance(entry);
    });

    // モーダルを閉じる
    document.getElementById('close-modal').addEventListener('click', () => {
      modal.classList.remove('open');
      selectedSpotId = null;
      spotEntries.forEach((item) => item.labelEl.classList.remove('selected'));
    });

    // 視点リセットボタン
    document.getElementById('reset-cam').addEventListener('click', () => {
      camera.position.copy(defaultCamPos);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    // ジャンル絞り込みフィルター
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        filterBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        const cat = btn.dataset.category;
        spotEntries.forEach((entry) => {
          let isMatch = false;
          if (cat === 'all') {
            isMatch = true;
          } else if (cat === 'stamped') {
            isMatch = isStamped(entry.data.id);
          } else {
            isMatch = entry.data.category === cat;
          }

          entry.visible = isMatch;
          entry.group.visible = isMatch;
          entry.labelEl.style.display = isMatch ? 'flex' : 'none';
        });

        if (selectedSpotId) {
          const current = spotEntries.find((i) => i.data.id === selectedSpotId);
          if (current && !current.visible) {
            modal.classList.remove('open');
            selectedSpotId = null;
          }
        }
      });
    });

    /**
     * =========================================================================
     * アニメーションループ＆3D座標→2D画面座標の同期
     * =========================================================================
     */
    const clock = new THREE.Clock();
    const tempV = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      spotEntries.forEach((entry, idx) => {
        if (!entry.visible) return;
        const baseHeight = entry.data.category === 'base' ? 3.2 : 2.6;
        entry.crystal.rotation.y = elapsed * 2 + idx;
        entry.crystal.position.y = baseHeight + Math.sin(elapsed * 3 + idx) * 0.18;

        // 選択中またはスタンプ済みは魔法陣リングを演出
        if (entry.data.id === selectedSpotId) {
          const scale = 1.15 + Math.sin(elapsed * 6) * 0.1;
          entry.ring.scale.set(scale, scale, 1);
        } else {
          entry.ring.scale.set(1, 1, 1);
        }

        tempV.set(entry.data.x, baseHeight + 0.7, entry.data.z);
        tempV.project(camera);

        if (tempV.z > 1) {
          entry.labelEl.style.display = 'none';
        } else {
          entry.labelEl.style.display = 'flex';
          const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
          const y = (-(tempV.y * 0.5) + 0.5) * window.innerHeight;
          entry.labelEl.style.left = `${x}px`;
          entry.labelEl.style.top = `${y}px`;
        }
      });

      steams.forEach((s) => {
        s.position.y += s.userData.speed;
        s.scale.setScalar(1 + Math.sin(elapsed * 2 + s.userData.offset) * 0.2);
        if (s.position.y > 3.2) {
          s.position.y = s.userData.baseY;
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
